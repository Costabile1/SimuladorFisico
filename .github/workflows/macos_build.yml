name: macOS Build

on:
  push:
    branches: [ main ] # Se dispara cada vez que subís algo a la rama main
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest # GitHub nos presta una Mac virtual actualizada

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar SFML via Homebrew
        run: |
          brew install sfml

      - name: Compilar el proyecto
        run: |
          # Creamos la carpeta para los objetos
          mkdir -p obj
          
          # Compilamos ImGui y tus archivos .cpp
          # Nota: Ajustá los nombres de tus archivos si es necesario
          g++ -std=c++17 src/*.cpp ImGui/*.cpp \
          -Iinclude \
          -IImGui \
          -I/opt/homebrew/include \
          -L/opt/homebrew/lib \
          -lsfml-graphics -lsfml-window -lsfml-system \
          -Wno-null-conversion \
          -Wno-macro-redefined \
          -ferror-limit=0 \
          -framework OpenGL \
          -o simulador_mac

          # 2. Crear carpeta de distribución
          mkdir -p simulador_dist/assets
          cp simulador_mac simulador_dist/
          cp -r assets/* simulador_dist/assets/ 2>/dev/null || true

          # 3. Copiar las librerías .dylib reales (no los links) al lado del ejecutable
          # Esto busca donde Homebrew instaló SFML y copia los archivos
          for lib in graphics window system; do
            cp /opt/homebrew/lib/libsfml-$lib.3.0.dylib simulador_dist/
            # Le decimos al ejecutable que use la librería que está al lado de él
            install_name_tool -change /opt/homebrew/opt/sfml/lib/libsfml-$lib.3.0.dylib @executable_path/libsfml-$lib.3.0.dylib simulador_dist/simulador_mac
          done
          
      - name: Subir binario como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: simulador-macOS
          path: simulador_mac

          