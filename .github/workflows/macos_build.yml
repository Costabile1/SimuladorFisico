name: macOS Build

on:
  push:
    branches: [ main ] # Se dispara cada vez que subís algo a la rama main
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest # GitHub nos presta una Mac virtual actualizada

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar SFML via Homebrew
        run: |
          brew install sfml

      - name: Compilar el proyecto
        run: |
          # Creamos la carpeta para los objetos
          mkdir -p obj
          
          # Compilamos ImGui y tus archivos .cpp
          # Nota: Ajustá los nombres de tus archivos si es necesario
          g++ -std=c++17 src/*.cpp ImGui/*.cpp \
          -Iinclude \
          -IImGui \
          -I/opt/homebrew/include \
          -L/opt/homebrew/lib \
          -lsfml-graphics -lsfml-window -lsfml-system \
          -Wno-null-conversion \
          -Wno-macro-redefined \
          -ferror-limit=0 \
          -framework OpenGL \
          -o simulador_mac

          # 2. Crear estructura
          mkdir -p simulador_dist
          cp simulador_mac simulador_dist/

          # 3. Descubrir directorio real
          REAL_LIB_DIR=$(pkg-config --variable=libdir sfml-all)
          
          # 4. Copiar SOLO la versión principal (ej. 3.0.dylib) para no duplicar
          # Ajustamos el patrón para que no agarre las versiones completas (.3.0.2)
          cp -L $REAL_LIB_DIR/libsfml-graphics.3.0.dylib simulador_dist/
          cp -L $REAL_LIB_DIR/libsfml-window.3.0.dylib simulador_dist/
          cp -L $REAL_LIB_DIR/libsfml-system.3.0.dylib simulador_dist/

          # 5. Cambiar las rutas internas del ejecutable
          # install_name_tool cambia la ruta absoluta del sistema por @executable_path
          install_name_tool -change "$REAL_LIB_DIR/libsfml-graphics.3.0.dylib" "@executable_path/libsfml-graphics.3.0.dylib" simulador_dist/simulador_mac
          install_name_tool -change "$REAL_LIB_DIR/libsfml-window.3.0.dylib" "@executable_path/libsfml-window.3.0.dylib" simulador_dist/simulador_mac
          install_name_tool -change "$REAL_LIB_DIR/libsfml-system.3.0.dylib" "@executable_path/libsfml-system.3.0.dylib" simulador_dist/simulador_mac

          # 6. Verificación final
          echo "=== ARCHIVOS LIMPIOS PARA EL ZIP ==="
          ls -lh simulador_dist/
          
      - name: Subir binario como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: simulador-macOS
          path: simulador_mac

          