name: macOS Build

on:
  push:
    branches: [ main ] # Se dispara cada vez que subís algo a la rama main
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest # GitHub nos presta una Mac virtual actualizada

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar SFML via Homebrew
        run: |
          brew install sfml

      - name: Compilar el proyecto
        run: |
          # Creamos la carpeta para los objetos
          mkdir -p obj
          
          # Compilamos ImGui y tus archivos .cpp
          # Nota: Ajustá los nombres de tus archivos si es necesario
          g++ -std=c++17 src/*.cpp ImGui/*.cpp \
          -Iinclude \
          -IImGui \
          -I/opt/homebrew/include \
          -L/opt/homebrew/lib \
          -lsfml-graphics -lsfml-window -lsfml-system \
          -Wno-null-conversion \
          -Wno-macro-redefined \
          -ferror-limit=0 \
          -framework OpenGL \
          -o simulador_mac

          # 2. Crear estructura de carpetas
          cp simulador_mac simulador_dist/
          
          # 3. Copiar Assets (si existen)
          if [ -d "assets" ]; then cp -r assets/* simulador_dist/assets/; fi

          # 4. Copiar librerías usando comodines (*) para no errar la versión
          # Esto copia cualquier versión de SFML que haya instalado brew
          cp /opt/homebrew/lib/libsfml-graphics*.dylib simulador_dist/
          cp /opt/homebrew/lib/libsfml-window*.dylib simulador_dist/
          cp /opt/homebrew/lib/libsfml-system*.dylib simulador_dist/

          # 5. DEBUG: Listar archivos para ver qué se va a subir
          echo "--- Contenido de la carpeta de distribución ---"
          ls -R simulador_dist
          
      - name: Subir binario como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: simulador-macOS
          path: simulador_mac

          