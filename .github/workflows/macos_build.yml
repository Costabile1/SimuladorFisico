name: macOS Build

on:
  push:
    branches: [ main ] # Se dispara cada vez que subís algo a la rama main
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest # GitHub nos presta una Mac virtual actualizada

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar SFML via Homebrew
        run: |
          brew install sfml

      - name: Compilar el proyecto
        run: |
          # Creamos la carpeta para los objetos
          mkdir -p obj
          
          # Compilamos ImGui y tus archivos .cpp
          # Nota: Ajustá los nombres de tus archivos si es necesario
          g++ -std=c++17 src/*.cpp ImGui/*.cpp \
          -Iinclude \
          -IImGui \
          -I/opt/homebrew/include \
          -L/opt/homebrew/lib \
          -lsfml-graphics -lsfml-window -lsfml-system \
          -Wno-null-conversion \
          -Wno-macro-redefined \
          -ferror-limit=0 \
          -framework OpenGL \
          -o simulador_mac

          # 2. Crear estructura
          mkdir -p simulador_dist
          cp simulador_mac simulador_dist/

          # 3. Descubrir dónde están REALMENTE las librerías
          # Esto evita el error si GitHub cambia la Mac o la ruta de instalación
          REAL_LIB_DIR=$(pkg-config --variable=libdir sfml-all)
          echo "Las librerías están en: $REAL_LIB_DIR"

          # 4. Copiar los archivos REALES (-L sigue el symlink hasta el archivo pesado)
          cp -L $REAL_LIB_DIR/libsfml-graphics*.dylib simulador_dist/
          cp -L $REAL_LIB_DIR/libsfml-window*.dylib simulador_dist/
          cp -L $REAL_LIB_DIR/libsfml-system*.dylib simulador_dist/

          # 5. Configurar el programa para que use las librerías locales
          # Para cada .dylib que hayamos copiado, cambiamos su referencia interna
          for lib in simulador_dist/*.dylib; do
             libname=$(basename $lib)
             install_name_tool -change "$REAL_LIB_DIR/$libname" "@executable_path/$libname" simulador_dist/simulador_mac
          done

          # 6. Mostrar el resultado final en los logs
          echo "=== ARCHIVOS LISTOS PARA EL ZIP ==="
          ls -lh simulador_dist/
          
      - name: Subir binario como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: simulador-macOS
          path: simulador_mac

          